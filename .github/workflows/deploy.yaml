name: Build and Deploy

on:
  push:
    branches:
      - v5
    paths-ignore:
      - 'public/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quartz uses git history to determine page creation and modification dates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Commit and Push Generated Public Folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/
          if git diff --staged --quiet; then
            echo "No changes in public folder to commit."
          else
            git commit -m "Automated build: update public folder [skip ci]"
            git push origin v5
          fi

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Trigger Remote Pull over Cloudflare Tunnel
        run: |
          ssh -o ProxyCommand="cloudflared access ssh --hostname %h" \
              -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              nate@ssh.nates.website \
              'cd /var/www/nates.website && git pull origin v5'